name: super_dialog
description: "A powerful, flexible, and beautifully animated dialog toolkit for Flutter. Create stunning dialogs with smooth slide, scale, fade, rotation, bounce, elastic, and flip animations."

# package version
version: 0.4.1

# package homepage, repository, issue tracker, and documentation links
homepage: https://github.com/GeniusSystems24/super_dialog
repository: https://github.com/GeniusSystems24/super_dialog
issue_tracker: https://github.com/GeniusSystems24/super_dialog/issues
documentation: https://github.com/GeniusSystems24/super_dialog#readme

topics:
  - dialog
  - animation
  - modal
  - popup
  - design-system

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  super_core: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
