name: super_dialog_example
description: A showcase example for super_dialog package with modern, elegant design.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  super_dialog:
    path: ../
  super_core: ^3.3.0
  google_fonts: ^6.3.3
  flutter_syntax_view: ^4.0.0
  go_router: ^17.3.0
  super_navigation_sidebar: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.3.1
  build_runner: ^2.4.15

dependency_overrides:
  super_core: ^3.3.0

flutter:
  uses-material-design: true
